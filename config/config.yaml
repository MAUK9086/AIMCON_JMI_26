project:
  name: "AIMCON_JMI_26"
  seed: 42
  device: "cuda"

paths:
  data_root: "data/isic2019"
  images_dir: "data/isic2019/ISIC_2019_Training_Input/ISIC_2019_Training_Input"
  metadata_csv: "data/isic2019/ISIC_2019_Training_Metadata.csv"
  ground_truth_csv: "data/isic2019/ISIC_2019_Training_GroundTruth.csv"
  outputs_dir: "outputs"
  models_dir: "outputs/models"
  figures_dir: "outputs/figures"
  tables_dir: "outputs/tables"

data:
  image_size: 224
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  stratify_by: "label"
  missing_age_strategy: "median"
  missing_sex_strategy: "unknown_category"
  missing_site_strategy: "unknown_category"

metadata_features:
  age: true          # normalised 0-1
  sex: true          # one-hot: male, female, unknown (3 dims)
  site: true         # one-hot: 9 sites + unknown (10 dims)
  total_dim: 14      # 1 + 3 + 10

models:
  image_encoder: "efficientnet_b3"
  image_pretrained: true
  image_feature_dim: 1536
  metadata_hidden: [64, 128, 64]
  metadata_feature_dim: 64
  fusion_hidden: [256]
  num_classes: 8
  dropout: 0.3

training:
  batch_size_image: 32
  batch_size_metadata: 256
  batch_size_fusion: 32
  epochs: 40
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: "cosine"
  early_stopping_patience: 7
  early_stopping_metric: "val_balanced_accuracy"
  use_class_weights: true

subgroups:
  indian_profile:
    sites: ["lower extremity", "palms/soles", "oral/genital", "upper extremity"]
    max_age: 55
  western_profile:
    sites: ["posterior torso", "anterior torso", "lateral torso"]
    min_age: 50
    sex: "male"
  malignant_classes: ["MEL", "BCC", "SCC"]

experiments:
  exp01_train_all: true
  exp02_occlusion: true
  exp03_gradients: true
  exp04_subgroup: true
  exp05_metadata_dropout: true
  exp06_reweighting: true
  exp07_age_stratified: true
  exp08_site_stratified: true
  exp09_correlation: true
  metadata_dropout_prob: 0.5
